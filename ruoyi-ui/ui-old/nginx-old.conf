server {
    listen       81;
    server_name  localhost;
    charset utf-8;

    location / {
        root   /usr/share/nginx/old_html;
        try_files $uri $uri/ /index.html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   html;
    }
}
